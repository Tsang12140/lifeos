services:
  lifeos:
    build: .
    ports:
      # Baota/Nginx on this host should proxy to 127.0.0.1:3001; do not expose the API directly.
      - "127.0.0.1:3001:3001"
    environment:
      LIFEOS_HOST: 0.0.0.0
      LIFEOS_PORT: 3001
      LIFEOS_DATA_DIR: /data
      LIFEOS_ACCOUNT_MODE: ${LIFEOS_ACCOUNT_MODE:-0}
      LIFEOS_OWNER_USERNAME: ${LIFEOS_OWNER_USERNAME:-}
      # In account mode this pair is only required for first-owner bootstrap; remove both afterward.
      LIFEOS_PASSWORD: ${LIFEOS_PASSWORD:-}
      LIFEOS_COOKIE_SECURE: ${LIFEOS_COOKIE_SECURE:-false}
      LIFEOS_ALLOWED_ORIGINS: ${LIFEOS_ALLOWED_ORIGINS:-}
      LIFEOS_AI_CONFIG_SECRET: ${LIFEOS_AI_CONFIG_SECRET:-}
      LIFEOS_WEATHER_CONFIG_SECRET: ${LIFEOS_WEATHER_CONFIG_SECRET:-}
      LIFEOS_MOVIE_CONFIG_SECRET: ${LIFEOS_MOVIE_CONFIG_SECRET:-}
      LIFEOS_BACKUP_CONFIG_SECRET: ${LIFEOS_BACKUP_CONFIG_SECRET:-}
      # Keep owner-uploaded local originals inside the persistent volume.
      LIFEOS_ASSET_ROOT: ${LIFEOS_ASSET_ROOT:-/data/assets}
      LIFEOS_BACKUP_DIR: ${LIFEOS_BACKUP_DIR:-/data/backups}
    volumes:
      - lifeos_data:/data
    restart: unless-stopped

volumes:
  lifeos_data:

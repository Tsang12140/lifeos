services:
  lifeos:
    build: .
    ports:
      # Baota/Nginx on this host should proxy to 127.0.0.1:3001; do not expose the API directly.
      - "127.0.0.1:3001:3001"
    environment:
      LIFEOS_HOST: 0.0.0.0
      LIFEOS_PORT: 3001
      LIFEOS_DATA_DIR: /data
      LIFEOS_ACCOUNT_MODE: ${LIFEOS_ACCOUNT_MODE:-0}
      LIFEOS_OWNER_USERNAME: ${LIFEOS_OWNER_USERNAME:-}
      # In account mode this pair is only required for first-owner bootstrap; remove both afterward.
      LIFEOS_PASSWORD: ${LIFEOS_PASSWORD:-}
      LIFEOS_COOKIE_SECURE: ${LIFEOS_COOKIE_SECURE:-false}
      LIFEOS_ALLOWED_ORIGINS: ${LIFEOS_ALLOWED_ORIGINS:-}
      LIFEOS_BODY_LIMIT_BYTES: ${LIFEOS_BODY_LIMIT_BYTES:-}
      LIFEOS_AI_CONFIG_SECRET: ${LIFEOS_AI_CONFIG_SECRET:-}
      LIFEOS_WEATHER_CONFIG_SECRET: ${LIFEOS_WEATHER_CONFIG_SECRET:-}
      LIFEOS_MOVIE_CONFIG_SECRET: ${LIFEOS_MOVIE_CONFIG_SECRET:-}
      LIFEOS_BACKUP_CONFIG_SECRET: ${LIFEOS_BACKUP_CONFIG_SECRET:-}
      # Optional integrations are read by the server process from the host .env.
      LIFEOS_DEEPSEEK_API_KEY: ${LIFEOS_DEEPSEEK_API_KEY:-}
      LIFEOS_DEEPSEEK_MODEL: ${LIFEOS_DEEPSEEK_MODEL:-}
      LIFEOS_DEEPSEEK_BASE_URL: ${LIFEOS_DEEPSEEK_BASE_URL:-}
      QWEATHER_KEY: ${QWEATHER_KEY:-}
      QWEATHER_LOCATION: ${QWEATHER_LOCATION:-}
      QWEATHER_CITY: ${QWEATHER_CITY:-}
      QWEATHER_HOST: ${QWEATHER_HOST:-}
      # Keep container logs on the persistent volume by default.
      LIFEOS_LOG_DIR: ${LIFEOS_LOG_DIR:-/data/logs}
      BACKUP_S3_ENABLED: ${BACKUP_S3_ENABLED:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # Keep owner-uploaded local originals inside the persistent volume.
      LIFEOS_ASSET_ROOT: ${LIFEOS_ASSET_ROOT:-/data/assets}
      LIFEOS_BACKUP_DIR: ${LIFEOS_BACKUP_DIR:-/data/backups}
    volumes:
      - lifeos_data:/data
    restart: unless-stopped

volumes:
  lifeos_data:

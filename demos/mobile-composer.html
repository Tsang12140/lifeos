<header class="demo-header">
  <div class="demo-title"><strong>手机输入与 AI 管家</strong><span>当前手机试案，保存固定在框外下方</span><a href="ui-reference.html">较早的综合外观 Demo</a></div>
  <div class="demo-controls">
    <div class="choice" aria-label="演示页面"><button data-page="journal" aria-pressed="true">日记输入</button><button data-page="ai" aria-pressed="false">AI 会话</button></div>
    <div class="choice" aria-label="提交按钮样式"><button data-style="text" aria-pressed="true">文字胶囊</button><button data-style="round" aria-pressed="false">圆形箭头</button></div>
    <label>照片入口<select id="photo-entry"><option value="toolbar">底栏按钮</option><option value="inline">框内加号</option></select></label>
    <label>内容<select id="sample"><option value="short">一段文字</option><option value="empty">空白</option><option value="photos">带照片</option><option value="long">长文</option></select></label>
    <label class="desktop-control">宽度<select id="width"><option>390</option><option>320</option><option>430</option></select></label>
    <button id="keyboard-toggle" class="desktop-control" aria-pressed="false">模拟键盘</button>
  </div>
</header>
<main class="stage">
  <div class="phone" id="phone" data-style="text" data-photo-entry="toolbar">
    <section class="home" id="home" aria-label="日记页面">
      <header class="app-header"><span class="brand"><svg><use href="#logo"/></svg>LifeOS</span><button class="icon-button" aria-label="打开演示菜单" data-toast="这是输入区 Demo，其他页面未接入。"><svg><use href="#menu"/></svg></button></header>
      <div class="home-scroll">
        <div class="date-heading"><div><span>周四</span><h1>10月15日</h1></div><span class="weather">晴 <span>24–29°</span></span></div>
        <section class="composer" aria-label="日记编辑器">
          <div class="composer-toolbar"><div class="kind-switcher" role="tablist" aria-label="记录类型"><button role="tab" aria-selected="true" data-kind="journal"><svg><use href="#notebook"/></svg>日记</button><button role="tab" aria-selected="false" data-kind="task"><svg><use href="#tasks"/></svg>任务</button></div><button class="icon-button" aria-label="搜索演示记录" data-toast="此 Demo 只演示输入与提交。"><svg><use href="#search"/></svg></button></div>
          <div class="writing-surface">
            <textarea id="journal-input" aria-label="日记内容" rows="3"></textarea>
            <div class="journal-photo-area"><div class="photos" id="journal-photos" hidden></div><button class="icon-button journal-photo-inline" id="journal-photo-inline" type="button" aria-label="添加照片" title="添加照片" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
          </div>
          <div class="composer-bottom action-row">
            <div class="composer-tools" role="group" aria-label="记录工具">
              <button class="icon-button" id="journal-photo" aria-label="添加照片" title="添加照片"><svg><use href="#image"/></svg></button>
              <button class="icon-button" aria-label="插入人物" title="插入人物" data-insert="小禾"><svg><use href="#user"/></svg></button>
              <button class="icon-button" aria-label="插入地点" title="插入地点" data-insert="河岸书店"><svg><use href="#pin"/></svg></button>
              <button class="icon-button" id="privacy" aria-label="隐私记录" title="隐私记录" aria-pressed="false"><svg><use href="#lock"/></svg></button>
              <button class="icon-button" id="date-open" aria-label="发生时间" title="选择发生时间"><svg><use href="#calendar"/></svg></button>
            </div>
            <button class="action primary submit" id="journal-save" aria-label="保存"><span class="submit-label">保存</span><svg class="submit-arrow"><use href="#arrow-up"/></svg></button>
          </div>
        </section>
        <div class="feed-heading"><h2>今天</h2><span id="record-count">2 条记录</span></div>
        <div class="feed" id="feed"><article class="record"><time>12:30</time><p>午饭后出门走了走，树荫下面很凉快。</p></article><article class="record"><time>09:10</time><p>把桌面收拾好了，泡杯茶，慢慢开始今天。</p></article></div>
        <p class="local-note">虚构记录，仅供试用</p>
      </div>

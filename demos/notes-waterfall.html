  <section class="preview-shell" id="preview" data-size="desktop" aria-label="笔记布局预览"><div class="board no-pictures" id="board" data-style="milanote"><div class="board-content">
    <div class="board-heading"><div><h1 class="page-title">笔记</h1><p class="page-count" id="note-count" aria-live="polite"></p></div><div class="board-emblem"><svg aria-hidden="true"><use href="#i-note"/></svg><span id="board-mood"></span></div></div>
    <div class="library-toolbar"><div class="filters" role="group" aria-label="笔记类型"><button class="filter" type="button" data-filter="all" aria-pressed="true">全部</button><button class="filter" type="button" data-filter="article" aria-pressed="false">文章</button><button class="filter" type="button" data-filter="fragment" aria-pressed="false">碎片</button><button class="filter" type="button" data-filter="quote" aria-pressed="false">摘抄</button></div><label class="search"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" aria-label="查找笔记" placeholder="查找笔记" autocomplete="off"><button class="clear-search" id="clear-search" type="button" aria-label="清空查找" hidden><svg aria-hidden="true"><use href="#i-x"/></svg></button></label></div>
    <div class="masonry" id="notes"></div><div class="empty" id="empty" role="status" hidden>没有找到这条笔记<br>换个关键词试试。</div>
  </div></div></section>
  <footer class="demo-footer"><span>四版共用相同内容与排序，仅比较展示方式。</span><span>卡片无内部滚动，长文在打开后阅读。</span></footer>
</main>
<dialog class="reader" id="reader" aria-labelledby="reader-title"><div class="reader-layout"><header class="reader-top"><span class="reader-meta" id="reader-meta"></span><button class="reader-close" id="reader-close" type="button" aria-label="关闭全文"><svg aria-hidden="true"><use href="#i-x"/></svg></button></header><div class="reader-body"><div class="reader-art" id="reader-art" hidden></div><h2 class="reader-title" id="reader-title"></h2><p class="reader-text" id="reader-text"></p><p class="reader-source" id="reader-source" hidden></p><div class="reader-date" id="reader-date"></div></div></div></dialog>
<script>
(() => {
  'use strict';
  const platform=navigator.userAgentData?.platform||navigator.platform||navigator.userAgent;
  if(/win/i.test(platform))document.documentElement.style.setProperty('--ui-font','MiSans,system-ui,"Microsoft YaHei",sans-serif');
  const directions={
    milanote:{name:'A 纸签灵感',detail:'柔白纸面、细微阴影，长短不一的文字像摊开的思绪。',mood:'收集一点灵感',url:'https://milanote.com/product/note-taking'},
    zoho:{name:'B 柔彩笔记',detail:'低饱和色块与柔和圆角，让不同笔记更容易一眼辨认。',mood:'给想法留个位置',url:'https://www.zoho.com/notebook/features.html'},
    cosmos:{name:'C 图文收藏',detail:'更鲜明的竖向构图，图片与大字摘抄形成收藏墙的节奏。',mood:'值得留下的片刻',url:'https://www.cosmos.so/'},
    bear:{name:'D 安静阅读',detail:'克制的边线、舒展的正文，让文字本身决定卡片的层次。',mood:'慢一点，读一读',url:'https://bear.app/'}
  };
  const notes=[
    {id:'n1',kind:'article',title:'把周末留给没有安排的事情',text:'最近想试着把周末空出一半。\n\n不提前订餐厅，不把行程排满。醒来后看看天气，再决定去河边散步，还是在家读完一本书。\n\n以前总觉得休息也应该有成果，最好能带回照片、打卡记录或一张完成的清单。现在更想留下一点松散的时间，让一天自己长出形状。\n\n也许真正的休息，是暂时不急着证明这一天过得有用。下个周末，先试一次。',topic:'生活',date:'10月14日',pinned:true,tone:'sage'},
    {id:'n2',kind:'fragment',text:'下次去旧书店，记得带一个空一点的袋子。\n\n想找几本讲植物和街道的书，最好有手绘插图。',topic:'小事',date:'10月14日',tone:'sand'},
    {id:'n3',kind:'quote',text:'有些想法不需要马上变成计划。先把它写下来，就已经给它留了一个位置。',source:'写给自己的便签',topic:'思考',date:'10月13日',tone:'mist'},
    {id:'n4',kind:'article',title:'窗边那一束下午的光',text:'四点左右，光从窗框斜着落下来。\n\n同一把椅子、同一盆植物，因为光线的方向变了，突然像是换了一个房间。\n\n想留意那些不需要买新东西，就能让日常重新变得有趣的变化：换个位置坐，打开平时拉着的窗帘，把桌上的花移到另外一边。',cover:'window',coverLabel:'窗边光线与植物示意插画',topic:'观察',date:'10月13日',tone:'sand'},
    {id:'n5',kind:'fragment',text:'今天想到一个做饭的小办法：\n\n把常做的五道菜写在冰箱上。买菜前选两道，剩下的食材随意搭配。\n\n少一点每天从零开始决定的疲惫。',topic:'日常',date:'10月12日',tone:'blush'},
    {id:'n6',kind:'quote',text:'生活里值得留下的，常常是那些当时没觉得特别的瞬间。',source:'散步时的随记',topic:'日常',date:'10月12日',pinned:true,tone:'sage'},
    {id:'n7',kind:'article',title:'一条可以反复走的小路',text:'河边这条路已经走过很多次。\n\n春天看树发芽，夏天等傍晚的风，秋天注意到叶子落在不同的地方。路本身没怎么变，变化的是我愿意留意什么。\n\n不需要每一次出门都去新地方。熟悉的路线会让人放松下来，也更容易察觉细小的变化。',cover:'sun',coverLabel:'太阳、山丘与弯曲小路示意插画',topic:'散步',date:'10月11日',tone:'mist'},
    {id:'n8',kind:'fragment',text:'想试着每周留一张没有人的照片。\n\n拍桌面、门口的树，或刚洗好的杯子。过几个月再看，应该也能认出那段时间。',topic:'记录',date:'10月11日',tone:'sage'},
    {id:'n9',kind:'article',title:'喜欢的东西都有一点相似',text:'翻收藏夹，发现自己总在保存相近的颜色：苔绿、燕麦、旧木头，还有阴天的灰。\n\n它们放在一起很安静，像一个可以慢慢住进去的角落。以后布置房间时，也许可以从这些反复出现的偏好开始。\n\n不用急着给风格起名字。喜欢过几次的东西，会慢慢告诉我答案。',cover:'chair',coverLabel:'苔绿色椅子与暖灰空间示意插画',topic:'收藏',date:'10月10日',tone:'blush'},
    {id:'n10',kind:'fragment',text:'雨停之后的空气，有一点像把房间重新打开了。',topic:'片刻',date:'10月10日',tone:'mist'},
    {id:'n11',kind:'quote',text:'把注意力还给眼前的事，也是一种整理。',source:'读书后的随想',topic:'阅读',date:'10月9日',tone:'sand'},
    {id:'n12',kind:'fragment',text:'一个还没想好的主意：\n\n把过去一年拍过的天空，按月份排成十二张小卡。只写日期，不加解释。',topic:'灵感',date:'10月8日',tone:'sage'}
  ];
  const labels={article:'文章',fragment:'碎片',quote:'摘抄'},icons={article:'note',fragment:'spark',quote:'quote'};
  const board=document.getElementById('board'),grid=document.getElementById('notes'),preview=document.getElementById('preview'),search=document.getElementById('search'),reader=document.getElementById('reader');
  let selectedStyle='milanote',filter='all',pictures=false,frame=0,returnFocus=null;
  const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=name=>'<svg aria-hidden="true"><use href="#i-'+name+'"/></svg>';
  const artwork=note=>'<svg role="img" aria-label="'+escape(note.coverLabel)+'" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice"><use href="#art-'+note.cover+'"/></svg>';
  function layout(){
    const width=grid.clientWidth;if(!width)return;
    const gap=parseFloat(getComputedStyle(board).getPropertyValue('--gap'))||20;
    const columns=Math.max(1,Math.min(3,Math.floor((width+gap)/(260+gap))));
    const cardWidth=(width-gap*(columns-1))/columns;
    const cards=[...grid.children],heights=Array(columns).fill(0);
    cards.forEach(card=>card.style.width=cardWidth+'px');
    cards.forEach(card=>{const column=heights.indexOf(Math.min(...heights));const x=column*(cardWidth+gap),y=heights[column];card.style.transform='translate3d('+x+'px,'+y+'px,0)';heights[column]+=card.offsetHeight+gap});
    grid.style.height=Math.max(0,Math.max(...heights)-gap)+'px';grid.dataset.columns=String(columns);grid.classList.add('ready');
  }
  function schedule(){cancelAnimationFrame(frame);frame=requestAnimationFrame(layout)}
  function render(){
    const query=search.value.trim().toLocaleLowerCase();
    const visible=notes.filter(note=>(filter==='all'||note.kind===filter)&&[note.title||'',note.text,note.source||'',note.topic].join(' ').toLocaleLowerCase().includes(query));
    grid.classList.remove('ready');
    grid.innerHTML=visible.map(note=>'<article class="note-card" role="button" tabindex="0" data-id="'+note.id+'" data-kind="'+note.kind+'" data-tone="'+note.tone+'" aria-label="查看'+labels[note.kind]+' '+escape(note.title||note.text.slice(0,32))+'">'+(note.cover?'<div class="card-cover">'+artwork(note)+'</div>':'')+'<div class="card-body"><div class="card-meta"><span class="kind">'+icon(icons[note.kind])+labels[note.kind]+'</span>'+(note.pinned?'<span class="pin">'+icon('pin')+'留存</span>':'')+'</div>'+(note.title?'<h2 class="card-title">'+escape(note.title)+'</h2>':'')+(note.kind==='quote'?'<span class="quote-mark" aria-hidden="true">“</span>':'')+'<p class="card-text">'+escape(note.text)+'</p>'+(note.source?'<p class="card-source">'+escape(note.source)+'</p>':'')+'<div class="card-footer"><span class="card-topic">'+escape(note.topic)+'</span><time>'+note.date+'</time></div></div></article>').join('');
    document.getElementById('note-count').textContent=visible.length+' 则笔记';document.getElementById('empty').hidden=visible.length!==0;document.getElementById('clear-search').hidden=search.value.length===0;
    document.querySelectorAll('[data-filter]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.filter===filter)));schedule();
  }
  function chooseStyle(style){
    selectedStyle=style;board.dataset.style=style;const direction=directions[style];
    document.querySelectorAll('[data-style-choice]').forEach(button=>{const selected=button.dataset.styleChoice===style;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1});
    document.getElementById('direction-name').textContent=direction.name;document.getElementById('direction-detail').textContent=direction.detail;document.getElementById('reference').href=direction.url;document.getElementById('board-mood').textContent=direction.mood;schedule();
  }
  function openNote(card){
    const note=notes.find(item=>item.id===card.dataset.id);if(!note)return;
    returnFocus=card;document.getElementById('reader-meta').textContent=labels[note.kind]+' / '+note.topic;document.getElementById('reader-title').textContent=note.title||labels[note.kind];document.getElementById('reader-text').textContent=note.text;
    const source=document.getElementById('reader-source');source.textContent=note.source||'';source.hidden=!note.source;document.getElementById('reader-date').textContent=note.date;
    const art=document.getElementById('reader-art');art.innerHTML=note.cover&&pictures?artwork(note):'';art.hidden=!(note.cover&&pictures);reader.showModal();document.getElementById('reader-close').focus({preventScroll:true});
  }
  document.querySelectorAll('[data-style-choice]').forEach(button=>{
    button.addEventListener('click',()=>chooseStyle(button.dataset.styleChoice));
    button.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const buttons=[...document.querySelectorAll('[data-style-choice]')],current=buttons.indexOf(button),index=event.key==='Home'?0:event.key==='End'?buttons.length-1:(current+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[index].focus();chooseStyle(buttons[index].dataset.styleChoice)});
  });
  document.querySelectorAll('[data-size-choice]').forEach(button=>button.addEventListener('click',()=>{preview.dataset.size=button.dataset.sizeChoice;document.querySelectorAll('[data-size-choice]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));schedule()}));
  document.querySelectorAll('[data-pictures-choice]').forEach(button=>button.addEventListener('click',()=>{pictures=button.dataset.picturesChoice==='true';board.classList.toggle('no-pictures',!pictures);document.querySelectorAll('[data-pictures-choice]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));schedule()}));
  document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;render()}));
  search.addEventListener('input',render);document.getElementById('clear-search').addEventListener('click',()=>{search.value='';render();search.focus()});
  grid.addEventListener('click',event=>{const card=event.target.closest('.note-card');if(card&&!window.getSelection()?.toString())openNote(card)});
  grid.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){const card=event.target.closest('.note-card');if(card){event.preventDefault();openNote(card)}}});
  document.getElementById('reader-close').addEventListener('click',()=>reader.close());
  let backdropStart=false;reader.addEventListener('pointerdown',event=>{const r=reader.getBoundingClientRect();backdropStart=event.target===reader&&(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)});
  reader.addEventListener('click',event=>{const r=reader.getBoundingClientRect();if(backdropStart&&event.target===reader&&(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom))reader.close();backdropStart=false});
  reader.addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true})});
  let lastWidth=0;new ResizeObserver(()=>{const width=grid.clientWidth;if(Math.abs(width-lastWidth)>.1){lastWidth=width;schedule()}}).observe(grid);window.addEventListener('resize',schedule);document.fonts.ready.then(schedule);
  chooseStyle(selectedStyle);render();
})();
</script>
</body>
</html>

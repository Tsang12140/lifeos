<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef2f7" />
    <meta name="description" content="LifeOS 个人时间轴记录" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <!-- Older iOS ignores the manifest and only honours these two. Without them a
         home-screen icon opens in a Safari tab instead of as the app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>LifeOS - 今天</title>
    <style>
      html { min-height: 100%; scrollbar-gutter: stable; }
      body { min-width: 0; min-height: 100vh; margin: 0; background: #eef2f7; overflow-x: hidden; }
      #root { min-height: 100vh; }
      .startup-screen {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        color: #18243d;
        background: #eef2f7;
      }
      .startup-content { position: relative; display: grid; place-items: center; }
      .startup-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 40px;
        color: #18243d;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: .015em;
        line-height: 1;
      }
      .startup-brand-mark { display: block; flex: none; width: 40px; height: 40px; }
      .startup-feedback {
        position: absolute;
        top: calc(100% + 20px);
        left: 50%;
        display: grid;
        justify-items: center;
        gap: 12px;
        width: max-content;
        max-width: calc(100vw - 48px);
        max-height: min(62vh, 460px);
        overflow: auto;
        transform: translateX(-50%);
        color: #5d6b82;
        font-size: .9rem;
        text-align: center;
      }
      .startup-feedback p { margin: 0; }
      .startup-diagnostic-detail { color: #5d6b82; font-size: .78rem; overflow-wrap: anywhere; }
      .startup-feedback button {
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid #cfd8e5;
        border-radius: 8px;
        background: #fff;
        color: #18243d;
        font: inherit;
        font-size: .85rem;
        cursor: pointer;
      }
    </style>
    <script>
      /* A blank screen is the only failure mode this app has that cannot explain
         itself. Safari shows a connection error, but an installed home-screen web
         app on iOS shows nothing at all, and there is no console to open on a
         phone. So the static startup screen doubles as a report: any error, any
         unhandled rejection, and a watchdog that asks the API whether it is
         reachable when the app has not taken over the root yet. */
      (function () {
        var reported = false;
        function show(title, detail) {
          if (reported) return;
          var root = document.getElementById("root");
          if (!root) return;
          var content = root.querySelector(".startup-content");
          if (!content) {
            // React had already taken over the root and then threw: React empties the
            // element on unmount, taking this startup screen with it. Rebuild the frame
            // here instead of returning — an unexplained white page is the one failure
            // this app cannot afford, because a phone has no console to open.
            root.textContent = "";
            var shell = document.createElement("main");
            shell.className = "startup-screen";
            shell.setAttribute("role", "alert");
            shell.setAttribute("aria-label", "LifeOS");
            content = document.createElement("div");
            content.className = "startup-content";
            var brand = document.createElement("div");
            brand.className = "startup-brand";
            var mark = document.createElement("img");
            mark.className = "startup-brand-mark";
            mark.src = "/favicon.svg?v=3";
            mark.width = 40;
            mark.height = 40;
            mark.alt = "";
            var name = document.createElement("span");
            name.textContent = "LifeOS";
            brand.appendChild(mark);
            brand.appendChild(name);
            content.appendChild(brand);
            shell.appendChild(content);
            root.appendChild(shell);
          }
          reported = true;
          var box = document.getElementById("startup-diagnostic");
          if (!box) {
            box = document.createElement("div");
            box.id = "startup-diagnostic";
            box.className = "startup-feedback";
            box.setAttribute("role", "alert");
            content.appendChild(box);
          }
          function line(text, className) {
            if (!text) return;
            var p = document.createElement("p");
            if (className) p.className = className;
            p.textContent = text;
            box.appendChild(p);
          }
          line(title);
          line(detail, "startup-diagnostic-detail");
          line(window.location.href, "startup-diagnostic-detail");
          var button = document.createElement("button");
          button.type = "button";
          button.textContent = "重新加载";
          button.onclick = function () { window.location.reload(); };
          box.appendChild(button);
        }
        window.addEventListener("error", function (event) {
          var target = event.target;
          if (target && target.tagName && target.tagName !== "SCRIPT") return;
          var message = event && event.message ? event.message : "脚本没能加载";
          var source = target && target.src ? "来源：" + target.src : "";
          show("页面脚本出错，没能启动。", message + (source ? "　" + source : ""));
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          show("页面启动时出现异常。", reason && reason.message ? reason.message : String(reason));
        });
        window.setTimeout(function () {
          var root = document.getElementById("root");
          var stillStarting = Boolean(root && root.querySelector(".startup-screen"));
          var emptied = !root || root.childElementCount === 0;
          if (!stillStarting && !emptied) return;
          var detail = "";
          var probe = window.fetch ? window.fetch("/api/health", { cache: "no-store" }) : null;
          if (!probe) { show("页面长时间没有启动完成。", "这台设备的浏览器可能太旧，或脚本被拦截。"); return; }
          probe.then(function (response) {
            detail = response.ok ? "服务可以连上，但页面脚本没有完成启动。" : "服务返回 " + response.status + "。";
            show("页面 10 秒内没有启动完成。", detail);
          }).catch(function () {
            show("页面 10 秒内没有启动完成。", "连不上服务：/api/health 请求失败。多半是地址或网络变了。");
          });
        }, 10000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="startup-screen" role="status" aria-label="LifeOS">
        <div class="startup-content">
          <div class="startup-brand">
            <img class="startup-brand-mark" src="/favicon.svg?v=3" width="40" height="40" alt="" />
            <span>LifeOS</span>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
